<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS-Stats — Top ASN</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<nav class="site-nav" aria-label="Main navigation">
<a href="/" aria-current="page">Top ASN</a>
<a href="/view-asn">View ASN</a>
<a href="/link-usage">Link Usage</a>
<a href="/ipv">IPv</a>
</nav>
<main>
<h1>Top ASN</h1>
<form id="top-form">
<label>Top <input id="limit" type="number" min="1" max="300" step="1" value="20" required></label>
<button type="submit">SET</button>
<div class="quick-limits" aria-label="Quick selection">
<button type="button" data-limit="20">20</button><button type="button" data-limit="50">50</button><button type="button" data-limit="300">300</button>
</div>
</form>
<p id="top-status" role="status"></p>
<p id="top-period"></p>
<p class="update-note">Updated every 20 minutes</p>
<div class="top-workspace">
<aside aria-label="Link legend"><ul id="link-legend"></ul><p id="legend-status" role="status"></p></aside>
<section aria-label="ASN ranking">
<p>Total includes traffic counted across all links.</p>
<div class="table-scroll"><table id="ranking" hidden><thead><tr><th>Rank</th><th>ASN</th><th>Input</th><th>Output</th><th>Total</th></tr></thead><tbody id="ranking-rows"></tbody></table></div>
</section>
</div>
</main>
<footer id="top-timezone"></footer>
<script src="/static/asn-metadata.js?v=20261005-1"></script>
<script src="/static/svg-images.js?v=20261005-1"></script>
<script src="/static/top-asn.js?v=20261008-ranking1"></script>
</body>
</html>
